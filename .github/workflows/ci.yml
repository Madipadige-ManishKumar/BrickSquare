name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Backend (Node.js / Express / Mongoose) — install, lint, test
  # ---------------------------------------------------------------------------
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Run tests
        run: npm test
        env:
          MONGO_DB_URL: mongodb://localhost:27017/real-estate-test
          JWT_SECRET: test-secret

  # ---------------------------------------------------------------------------
  # Frontend (React / Vite) — install, lint, build
  # ---------------------------------------------------------------------------
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./Client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # ML prediction service (Flask / scikit-learn) — install, smoke test
  # ---------------------------------------------------------------------------
  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ML-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify model loads
        run: python -c "import joblib; joblib.load('price_model.pkl'); print('model ok')"